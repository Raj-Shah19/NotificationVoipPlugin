name: notification_voip_plugin
description: "A Flutter plugin for notifications (8 templates, grouping) and VoIP calls (CallKit/Telecom, custom Flutter screen) across 6 platforms."
version: 2.1.0
homepage: https://github.com/Raj-Shah19/NotificationVoipPlugin
repository: https://github.com/Raj-Shah19/NotificationVoipPlugin
issue_tracker: https://github.com/Raj-Shah19/NotificationVoipPlugin/issues
topics:
  - notifications
  - voip
  - callkit
  - push-notifications
  - flutter-plugin


environment:
  sdk: ^3.7.2
  flutter: '>=3.2.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
flutter:
  plugin:
    platforms:
      android:
        package: com.example.notification_voip_plugin
        pluginClass: NotificationVoipPlugin
      ios:
        pluginClass: NotificationVoipPlugin
      web:
        pluginClass: NvpWeb
        fileName: src/nvp_web.dart
      macos:
        pluginClass: NotificationVoipPlugin
      windows:
        pluginClass: NotificationVoipPluginCApi
      linux:
        pluginClass: NotificationVoipPlugin
